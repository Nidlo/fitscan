<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitScan API Docs</title>
  <meta name="description" content="FitScan API — AI-powered body measurement and 3D avatar generation for the fashion industry">
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .top-bar {
      background: #1a1a2e;
      color: white;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .top-bar h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
    .top-bar .version { background: #4CAF50; color: white; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .top-bar .links { display: flex; gap: 16px; align-items: center; }
    .top-bar a { color: #a0b4cc; text-decoration: none; font-size: 14px; transition: color 0.15s; }
    .top-bar a:hover { color: white; }
    .top-bar .btn {
      background: #e85d24;
      color: white;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
    }
    #redoc-container { min-height: calc(100vh - 52px); }
  </style>
</head>
<body>
  <div class="top-bar">
    <div style="display:flex;align-items:center;gap:12px">
      <h1>FitScan API</h1>
      <span class="version">v0.1.0</span>
    </div>
    <div class="links">
      <a href="#section/Authentication">Auth</a>
      <a href="#tag/Measure">Measure</a>
      <a href="#tag/Avatar">Avatar</a>
      <a href="FitScan.postman_collection.json" download>Download Postman</a>
      <a href="openapi.json" download>OpenAPI JSON</a>
      <a href="http://localhost:8000/docs" class="btn" target="_blank">Try it live</a>
    </div>
  </div>
  <div id="redoc-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/redoc@latest/bundles/redoc.standalone.js"></script>
  <script>
    Redoc.init('openapi.json', {
      theme: {
        colors: {
          primary: { main: '#e85d24' },
          success: { main: '#4CAF50' },
          http: {
            get: '#4CAF50',
            post: '#e85d24',
            delete: '#f44336'
          }
        },
        typography: {
          fontSize: '15px',
          headings: { fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' },
          code: { fontSize: '13px' }
        },
        sidebar: {
          backgroundColor: '#f8f9fa',
          width: '260px'
        }
      },
      hideDownloadButton: false,
      expandResponses: '200',
      pathInMiddlePanel: false,
      nativeScrollbars: false,
      requiredPropsFirst: true,
      sortPropsAlphabetically: false,
      showExtensions: false,
      hideHostname: false
    }, document.getElementById('redoc-container'));
  </script>
</body>
</html>
