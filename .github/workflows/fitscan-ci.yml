# =============================================================================
# Two-lane setup:
#   FAST LANE (quality):          Black + ruff + mypy. Always runs.
#   FULL LANE (unit/integration): pytest unit + pytest integration + codecov.
#                                 Skipped on dev-snad pushes; runs on PRs and
#                                 on pushes to development/staging/production.
#                                 The deploy job (production push only) chains
#                                 off integration-tests, so production pushes
#                                 always get the full suite.
# =============================================================================
name: FitScan CI/CD

on:
  push:
    branches: [dev-snad, development, staging, production]
    paths:
      - 'fitscan/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/fitscan-ci.yml'
  pull_request:
    branches: [development, staging, production]
    paths:
      - 'fitscan/**'
      - 'tests/**'
      - 'pyproject.toml'

# One run per workflow per branch. Cancel an older in-progress run if a
# new push lands, except on production, where deploy runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

env:
  PYTHON_VERSION: "3.11"
  # Force JavaScript-based actions onto Node 24. actions/github-script@v7 (used
  # by x-check.yml) still ships node20; this opts out of the deprecation
  # warning until v8 lands.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:

  quality:
    name: Lint & typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install black ruff mypy
      - run: black --check fitscan/ tests/
      - run: ruff check fitscan/ tests/
      - run: mypy fitscan/ --ignore-missing-imports

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    needs: quality
    # Skip on dev-snad pushes. Heavy lane runs on PR and on
    # promotion-branch pushes (development/staging/production).
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev-snad'
    # Hard ceiling so a stuck pip install or stalled cache step can't
    # burn 20+ minutes of free-tier action time. Pytest itself is ~90s;
    # the install on cache MISS is ~15 min; the cache save is ~5 min.
    # 25 min covers a worst-case cold cache with margin.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Split cache/restore + cache/save (instead of the combined
      # actions/cache@v4) so the SAVE happens as a normal step right
      # after install, NOT as a post-step. Two consequences:
      #   1. The job marks complete as soon as pytest exits; dependent
      #      jobs unblock immediately rather than waiting for the
      #      multi-GB cache upload to finish.
      #   2. We only save on cache MISS, so we don't re-upload the same
      #      ~2-3GB site-packages on every run that already had a hit.
      - name: Restore installed Python packages
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.pythonLocation }}
          # Suffix the key with -unit so it stays separate from
          # integration-tests' cache (which adds the [ml] stack on top).
          # Without the suffix, a unit-tests cache hit could starve the
          # integration job of the heavy deps.
          key: py-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}-unit
          restore-keys: |
            py-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}-unit-
            py-${{ env.pythonLocation }}-

      # Unit tests install [dev] ONLY: no torch / mediapipe / rembg /
      # onnxruntime / smplx / hmr2 deps. The whole ML stack lives in the
      # [ml] optional extra (see pyproject.toml). No chumpy bootstrap
      # needed because chumpy is in [ml] too.
      - run: pip install --upgrade pip setuptools wheel
      - run: pip install -e ".[dev]"

      - name: Save installed Python packages (cache miss only)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}-unit

      - name: Write .env.test
        run: |
          cat > .env.test <<'EOF'
          APP_ENV=test
          DATABASE_URL=sqlite:///./fitscan_test.db
          TEST_DATABASE_URL=sqlite:///./fitscan_test.db
          ANTHROPIC_API_KEY=test_placeholder
          STORAGE_BACKEND=local
          ENABLE_CLAUDE_VALIDATION=false
          ENABLE_SMPL_FITTING=false
          ENABLE_AVATAR_GENERATION=false
          CONFIDENCE_THRESHOLD=0.65
          LOG_LEVEL=WARNING
          EOF
          # Strip leading whitespace from each line
          sed -i 's/^[[:space:]]*//' .env.test

      - run: pytest tests/unit/ -v --tb=short --cov=fitscan --cov-report=xml

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: fitscan-unit
          fail_ci_if_error: false

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-22.04
    # Run in PARALLEL with unit-tests after quality passes; the two
    # test suites are independent and don't share state. Cuts the
    # workflow's critical path from sequential (unit + integration)
    # to max(unit, integration).
    needs: quality
    # Skip on dev-snad pushes. Heavy lane runs on PR and on
    # promotion-branch pushes (development/staging/production).
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev-snad'
    timeout-minutes: 25

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: fitscan
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fitscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Integration tests install [dev,ml]: needs the full ML stack
      # because real measurement pipelines run end-to-end (mediapipe
      # pose detection, rembg silhouettes, optional SMPL fit). Cache
      # key is suffixed -integration so it doesn't collide with the
      # smaller unit-tests cache.
      - name: Restore installed Python packages
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}-integration
          restore-keys: |
            py-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}-integration-
            py-${{ env.pythonLocation }}-

      # chumpy's setup.py does `import pip`, which fails under PEP 517
      # isolation. Pre-install it outside isolation BEFORE the editable
      # install; pip then sees it as already-satisfied.
      - run: pip install --upgrade pip setuptools wheel
      - run: pip install 'numpy>=1.26,<2'
      - run: pip install --no-build-isolation 'chumpy>=0.70'
      - run: pip install -e ".[dev,ml]"

      - name: Save installed Python packages (cache miss only)
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.pythonLocation }}
          key: py-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml') }}-integration

      - name: Write .env.test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > .env.test <<EOF
          APP_ENV=test
          DATABASE_URL=postgresql://fitscan:password@localhost:5432/fitscan_test
          TEST_DATABASE_URL=postgresql://fitscan:password@localhost:5432/fitscan_test
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-test_placeholder}
          FITSCAN_REQUIRE_API_KEY=false
          STORAGE_BACKEND=local
          ENABLE_CLAUDE_VALIDATION=false
          ENABLE_SMPL_FITTING=false
          ENABLE_AVATAR_GENERATION=false
          LOG_LEVEL=WARNING
          EOF
          sed -i 's/^[[:space:]]*//' .env.test

      - run: alembic upgrade head
      # --no-cov: coverage is already gated by the unit-tests job above;
      # the integration suite alone covers ~49% which trips fail-under=75.
      - run: pytest tests/integration/ -v --tb=short --no-cov


  # Deployment is handled by Coolify's GitHub webhook (push to production -> automatic deploy).
  # The old SSH-based deploy job was removed on 2026-11-19 when FitScan moved into Coolify.
