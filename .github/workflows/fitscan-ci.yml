name: FitScan CI/CD

on:
  push:
    branches: [dev-snad, development, staging, production]
    paths:
      - 'fitscan/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/fitscan-ci.yml'
  pull_request:
    branches: [development, staging, production]
    paths:
      - 'fitscan/**'
      - 'tests/**'
      - 'pyproject.toml'

# One run per workflow per branch. Cancel an older in-progress run if a
# new push lands — except on production, where deploy runs to the end.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

env:
  PYTHON_VERSION: "3.11"

jobs:

  quality:
    name: Lint & typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install black ruff mypy
      - run: black --check fitscan/ tests/
      - run: ruff check fitscan/ tests/
      - run: mypy fitscan/ --ignore-missing-imports

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-22.04
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Write .env.test
        run: |
          cat > .env.test <<'EOF'
          APP_ENV=test
          DATABASE_URL=sqlite:///./fitscan_test.db
          TEST_DATABASE_URL=sqlite:///./fitscan_test.db
          ANTHROPIC_API_KEY=test_placeholder
          STORAGE_BACKEND=local
          ENABLE_CLAUDE_VALIDATION=false
          ENABLE_SMPL_FITTING=false
          ENABLE_AVATAR_GENERATION=false
          CONFIDENCE_THRESHOLD=0.65
          LOG_LEVEL=WARNING
          EOF
          # Strip leading whitespace from each line
          sed -i 's/^[[:space:]]*//' .env.test

      - run: pytest tests/unit/ -v --tb=short --cov=fitscan --cov-report=xml

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: fitscan-unit
          fail_ci_if_error: false

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-22.04
    needs: unit-tests

    services:
      postgres:
        image: ankane/pgvector:latest
        env:
          POSTGRES_USER: fitscan
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fitscan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: pip install -e ".[dev]" psycopg2-binary pgvector alembic

      - name: Write .env.test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat > .env.test <<EOF
          APP_ENV=test
          DATABASE_URL=postgresql://fitscan:password@localhost:5432/fitscan_test
          TEST_DATABASE_URL=postgresql://fitscan:password@localhost:5432/fitscan_test
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-test_placeholder}
          FITSCAN_REQUIRE_API_KEY=false
          STORAGE_BACKEND=local
          ENABLE_CLAUDE_VALIDATION=false
          ENABLE_SMPL_FITTING=false
          ENABLE_AVATAR_GENERATION=false
          LOG_LEVEL=WARNING
          EOF
          sed -i 's/^[[:space:]]*//' .env.test

      - run: alembic upgrade head
      # --no-cov: coverage is already gated by the unit-tests job above;
      # the integration suite alone covers ~49% which trips fail-under=75.
      - run: pytest tests/integration/ -v --tb=short --no-cov

  deploy:
    name: Deploy FitScan to server
    runs-on: ubuntu-22.04
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/production' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /home/fitscan/app

            git fetch origin production
            git reset --hard origin/production

            venv/bin/pip install -e . --quiet
            venv/bin/alembic upgrade head
            sudo systemctl restart fitscan

            # fitscan loads PyTorch + MediaPipe on boot — cold start takes
            # 20-30s. Poll the healthcheck every 2s for up to 60s before
            # giving up. A flat sleep+single-curl was too short.
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/api/v1/health >/dev/null; then
                echo "FitScan deployed successfully (healthy after $((i*2))s)."
                exit 0
              fi
              sleep 2
            done
            echo "FitScan failed to come up within 60s — recent journal:"
            systemctl status fitscan --no-pager | head -20 || true
            exit 1
