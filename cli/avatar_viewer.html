<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FitScan Avatar Viewer</title>
  <style>body { margin:0; background:#1a1a2e; } canvas { display:block; }</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);
  const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(0, 1, 3);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  document.body.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 1.2);
  dir.position.set(1, 2, 3);
  scene.add(dir);
  const params = new URLSearchParams(location.search);
  const glbUrl = params.get('glb') || 'avatar.glb';
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
  s.onload = () => {
    const loader = new THREE.GLTFLoader();
    loader.load(glbUrl, gltf => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const centre = box.getCenter(new THREE.Vector3());
      model.position.sub(centre);
      scene.add(model);
    });
  };
  document.head.appendChild(s);
  let dragging = false, px = 0;
  renderer.domElement.addEventListener('mousedown', e => { dragging=true; px=e.clientX; });
  renderer.domElement.addEventListener('mouseup', () => dragging=false);
  renderer.domElement.addEventListener('mousemove', e => {
    if (!dragging) return;
    scene.rotation.y += (e.clientX - px) * 0.005;
    px = e.clientX;
  });
  renderer.domElement.addEventListener('wheel', e => {
    camera.position.z = Math.max(1, Math.min(6, camera.position.z + e.deltaY * 0.002));
  });
  (function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); })();
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
</html>
